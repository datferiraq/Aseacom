<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داتابيس اسياسيل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
  <style>
    * {
      margin: 0; 
      padding: 0; 
      box-sizing: border-box;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(120deg, #24243e, #302b63, #0f0c29);
      color: #fff;
      direction: rtl;
      min-height: 100vh;
    }
    header {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .container {
      width: 95%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .section {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }
    .section:hover {
      transform: translateY(-2px);
    }
    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 16px;
      outline: none;
    }
    input[type="file"] {
      cursor: pointer;
      background: #fff;
      color: #333;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4c8bf5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }
    button:hover {
      background: #3a73d0;
    }
    #progressContainer {
      width: 100%;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
      margin: 15px 0;
    }
    #progressBar {
      height: 100%;
      width: 0%;
      background: #00d277;
      transition: width 0.2s ease;
    }
    .results {
      margin-top: 20px;
      max-height: 500px;
      overflow-y: auto;
    }
    .result-item {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }
    .result-item:hover {
      background: rgba(255,255,255,0.3);
    }
    .result-table {
      width: 100%;
      border-collapse: collapse;
    }
    .result-table th, .result-table td {
      padding: 8px;
      vertical-align: top;
      text-align: right;
      color: #fff;
      font-size: 16px;
    }
    .result-table th {
      width: 140px;
      font-weight: 700;
      white-space: nowrap;
    }
    .icon {
      margin-left: 6px;
      color: #00ffb3;
    }
    .copy-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background: #00d277;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }
    .copy-btn:hover {
      background: #00a85a;
    }
    .back-button {
      display: inline-block;
      margin-bottom: 15px;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      text-decoration: underline;
    }
    .back-button:hover {
      color: #00ffb3;
    }
    #loginContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #loginContainer .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.4);
      width: 95%;
      max-width: 400px;
      text-align: center;
    }
    #loginContainer h2 {
      font-size: 26px; 
      margin-bottom: 20px;
    }
    #loginContainer label {
      display: block; 
      margin-bottom: 10px; 
      font-size: 18px; 
      font-weight: bold;
    }
    #loginContainer input {
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      font-size: 18px; 
      text-align: center; 
      outline: none;
      color: #333;
    }
    #loginContainer input::placeholder {
      color: #999;
    }
    #loginContainer button {
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 18px; 
      background: #00d277; 
      color: #fff; 
      transition: 0.3s; 
      font-weight: bold;
    }
    #loginContainer button:hover {
      background: #00a85a;
    }
    #loginContainer #error {
      color: #ff4d4d; 
      margin-top: 10px; 
      font-size: 16px; 
      font-weight: bold;
    }
    #loginContainer .footer {
      margin-top: 20px; 
      font-size: 14px; 
      color: #fff;
    }
    #loginContainer .footer a {
      color: #00ffb3; 
      text-decoration: none; 
      font-weight: bold;
    }
    @media (max-width: 600px) {
      header { font-size: 20px; }
      #loginContainer h2 { font-size: 22px; }
      button { font-size: 16px; }
      .result-table th, .result-table td { font-size: 14px; }
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAzeOYd4_rppBX_qvYOvgXj6le6FEyO1ac",
      authDomain: "database-87036.firebaseapp.com",
      projectId: "database-87036",
      storageBucket: "database-87036.firebasestorage.app",
      messagingSenderId: "147777098452",
      appId: "1:147777098452:web:c1c4c305d5e6e0cf0c2141",
      measurementId: "G-8S0XCNF1Y7"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function verifyCode() {
      const userCode = document.getElementById("userCode").value.trim().toUpperCase();
      const querySnapshot = await getDocs(collection(db, "codes"));
      let isValid = false;
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.code === userCode && data.isActive) {
          isValid = true;
        }
      });
      if (isValid) {
        alert("✅ الكود صحيح! سيتم توجيهك الآن.");
        showSearchApp();
      } else {
        document.getElementById("error").innerText = "❌ الكود غير صحيح أو تم تعطيله.";
      }
    }
    window.verifyCode = verifyCode;

    function showSearchApp() {
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("searchApp").style.display = "block";
    }
  </script>
</head>
<body>
  <div id="loginContainer">
    <div class="container">
      <h2>تسجيل الدخول</h2>
      <label for="userCode">كود التفعيل:</label>
      <input type="text" id="userCode" placeholder="أدخل كود التفعيل">
      <button onclick="verifyCode()">تسجيل الدخول</button>
      <div id="error"></div>
      <div class="footer">
        للحصول على كود تفعيل تواصل مع المطور 
        <a href="https://t.me/caser7" target="_blank">telegram:@caser7</a>
      </div>
    </div>
  </div>

  <div id="searchApp" style="display: none;">
    <header>داتابيس اسياسيل-زين@caser7</header>
    <div class="container">
      <div class="section upload-section" id="uploadSection">
        <input type="file" id="fileInput" accept=".txt">
      </div>
      <div class="section search-section hidden" id="searchSection">
        <div class="back-button" id="backButton">&#8592; رجوع</div>
        <input type="text" id="searchBox" placeholder="اكتب ما تريد البحث عنه">
        <button id="searchBtn">بحث</button>
        <div id="progressContainer">
          <div id="progressBar"></div>
        </div>
        <div id="resultCount" style="margin-bottom: 10px; font-size: 18px; font-weight: bold;"></div>
        <div class="results" id="results"></div>
      </div>
    </div>
  </div>

  <script>
    let file, chunkSize = 1024 * 1024, offset = 0, remainder = "", query = "";
    let matchCount = 0;
    const fileInput = document.getElementById("fileInput");
    const uploadSection = document.getElementById("uploadSection");
    const searchSection = document.getElementById("searchSection");
    const backButton = document.getElementById("backButton");
    const searchBtn = document.getElementById("searchBtn");
    const progressBar = document.getElementById("progressBar");
    const resultsContainer = document.getElementById("results");
    const searchBox = document.getElementById("searchBox");
    const resultCountDiv = document.getElementById("resultCount");

    fileInput.addEventListener("change", function(e) {
      file = e.target.files[0];
      if (!file) return;
      offset = 0;
      remainder = "";
      matchCount = 0;
      resultCountDiv.innerText = "";
      resultsContainer.innerHTML = "";
      uploadSection.classList.add("hidden");
      searchSection.classList.remove("hidden");
      window.scrollTo(0,0);
    });

    backButton.addEventListener("click", function() {
      fileInput.value = "";
      file = null;
      offset = 0;
      remainder = "";
      query = "";
      matchCount = 0;
      searchBox.value = "";
      progressBar.style.width = "0%";
      resultCountDiv.innerText = "";
      resultsContainer.innerHTML = "";
      searchSection.classList.add("hidden");
      uploadSection.classList.remove("hidden");
      window.scrollTo(0,0);
    });

    searchBtn.addEventListener("click", function() {
      query = searchBox.value.trim();
      if(query === "") {
        alert("يرجى إدخال نص للبحث");
        return;
      }
      resultsContainer.innerHTML = "";
      progressBar.style.width = "0%";
      resultCountDiv.innerText = "";
      offset = 0;
      remainder = "";
      matchCount = 0;
      processChunk();
    });

    function processChunk() {
      if(offset >= file.size) {
        if(remainder) processText(remainder);
        progressBar.style.width = "100%";
        if(matchCount === 0) {
          resultsContainer.innerHTML = "<div style='text-align: center; font-size:18px; color: #ff6666;'>لم يتم العثور على نتائج مطابقة، قم بتغيير الملف أو تعديل البحث</div>";
        }
        return;
      }
      const slice = file.slice(offset, offset + chunkSize);
      const reader = new FileReader();
      reader.onload = function(e) {
        let text = remainder + e.target.result;
        let lines = text.split("\n");
        remainder = lines.pop();
        processText(lines.join("\n"));
        offset += chunkSize;
        progressBar.style.width = Math.floor((offset / file.size) * 100) + "%";
        setTimeout(processChunk, 0);
      };
      reader.readAsText(slice);
    }

    function processText(text) {
      let lines = text.split("\n");
      lines.forEach(line => {
        if(line.includes(query)) {
          matchCount++;
          resultCountDiv.innerText = "عدد النتائج: " + matchCount;
          const fields = line.split(",");
          let copyText = "";
          let tableRows = "";

          if(fields[0] && fields[0].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-user icon"></i>الاسم:</th>
                <td>${fields[0].trim()}</td>
              </tr>`;
            copyText += "الاسم: " + fields[0].trim() + "\n";
          }
          if(fields[1] && fields[1].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-map-marker-alt icon"></i>المحافظه:</th>
                <td>${fields[1].trim()}</td>
              </tr>`;
            copyText += "المحافظه: " + fields[1].trim() + "\n";
          }
          if(fields[2] && fields[2].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-check-circle icon"></i>التفعيل:</th>
                <td>${fields[2].trim()}</td>
              </tr>`;
            copyText += "التفعيل: " + fields[2].trim() + "\n";
          }
          if(fields[3] && fields[3].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-phone icon"></i>الرقم:</th>
                <td>${fields[3].trim()}</td>
              </tr>`;
            copyText += "الرقم: " + fields[3].trim() + "\n";
          }
          if(fields[4] && fields[4].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-birthday-cake icon"></i>المواليد:</th>
                <td>${fields[4].trim()}</td>
              </tr>`;
            copyText += "المواليد: " + fields[4].trim() + "\n";
          }
          if(fields[5] && fields[5].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-id-card icon"></i>التومنيه:</th>
                <td>${fields[5].trim()}</td>
              </tr>`;
            copyText += "التومنيه: " + fields[5].trim() + "\n";
          }
          if(fields[6] && fields[6].trim() !== "") {
            tableRows += `
              <tr>
                <th><i class="fas fa-clock icon"></i>تاريخ التفعيل:</th>
                <td>${fields[6].trim()}</td>
              </tr>`;
            copyText += "تاريخ التفعيل: " + fields[6].trim() + "\n";
          }
          if(tableRows !== "") {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerHTML = `
              <table class="result-table">
                ${tableRows}
              </table>
              <button class='copy-btn' data-copy='${copyText.replace(/'/g, "&#39;")}' onclick='copyText(this)'>
                <i class="fas fa-copy"></i> نسخ
              </button>
            `;
            resultsContainer.appendChild(div);
          }
        }
      });
    }

    function copyText(el) {
      const text = el.getAttribute("data-copy");
      navigator.clipboard.writeText(text).then(() => {
        el.textContent = "تم النسخ";
        setTimeout(() => {
          el.innerHTML = `<i class="fas fa-copy"></i> نسخ`;
        }, 2000);
      });
    }
  </script>
</body>
</html>
