<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Cairo', sans-serif;

}

  height: 800px;
  background: radial-gradient(circle, rgba(227,6,19,0.22), transparent 60%);
  filter: blur(60px);
  z-index: -3;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(0,255,148,0.16), transparent 60%);
  filter: blur(70px);
  z-index: -3;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6,10,22,0.88);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #e30613, #ff1e30);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 25px rgba(227,6,19,0.45);
}
.logo-text h1 { font-size: 20px; font-weight: 900; }
.logo-text span { font-size: 11px; color: rgba(255,255,255,0.55); }
.container { width: 95%; max-width: 1180px; margin: 0 auto; padding: 24px 20px; }
.card {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 26px;
  margin-bottom: 20px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}
input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  background: rgba(0,0,0,0.35);
  color: #fff;
  font-family: 'Cairo';
  font-size: 15px;
  outline: none;
}
input:focus { border-color: #e30613; }
.btn-primary {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #e30613, #ff2d3f);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
}
.btn-sec {
  padding: 10px 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
}
#loginContainer {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-card { max-width: 440px; width: 100%; text-align: center; }
.prov-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
  gap: 10px;
  margin-top: 14px;
}
.prov-chip {
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 700;
}
.prov-chip.active {
  background: linear-gradient(135deg, #e30613, #ff1e30);
  border-color: #e30613;
  box-shadow: 0 8px 25px rgba(227,6,19,0.4);
}
#progressContainer {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  overflow: hidden;
  height: 20px;
  margin: 16px 0;
  display: none;
}
#progressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ff94, #4c8bf5);
  transition: width 0.25s;
}
.results { margin-top: 16px; max-height: 650px; overflow-y: auto; }
.result-item {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-right: 4px solid #00ff94;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}
.hidden { display: none !important; }
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 14px 22px;
  border-radius: 14px;
  z-index: 300;
  display: none;
}
.toast.show { display: flex; }
</style>

    <div style="width:88px;height:88px;background:linear-gradient(135deg,#e30613,#ff1a2d);border-radius:22px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:38px">📂</div>
    <h2 style="font-size:26px;font-weight:900">Asiacell</h2>

          <h4 style="font-weight:800">📍 فلترة حسب المحافظة</h4>

            <button class="btn-sec" style="font-size:12px" onclick="clearProv()">مسح</button>
            <span id="selectedProvText" style="font-size:12px;color:#00ff94;margin-right:auto;line-height:34px;font-weight:700"></span>

      <div style="display:flex;gap:12px;margin:14px 0;font-size:13px;color:rgba(255,255,255,0.7)">

        <span id="searchStats"></span>

</div>

<div class="toast" id="toast"><span id="toastText" style="font-weight:800"></span></div>

<script>
const debugEl = document.getElementById('debug');
function logDebug(msg){
  console.log(msg);
  if(debugEl) debugEl.innerHTML += msg + '<br>';
}

let db;
try{
  const firebaseConfig = {
    apiKey: "AIzaSyAzeOYd4_rppBX_qvYOvgXj6le6FEyO1ac",
    authDomain: "database-87036.firebaseapp.com",
    projectId: "database-87036",
    storageBucket: "database-87036.firebasestorage.app",
    messagingSenderId: "147777098452",
    appId: "1:147777098452:web:c1c4c305d5e6e0cf0c2141"
  };
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  logDebug('Firebase OK');
}catch(e){
  logDebug('Firebase Error: ' + e.message);
}

let files = [];
let chunkSize = 1048576;
let query = "";
let allResults = [];
let isSearching = false;
let shouldCancel = false;
let startTime = 0;
let selectedProvinces = new Set();
let provinceCounts = {};
let maxResults = 200;

const provinces = [
  "بغداد","البصرة","نينوى","أربيل",
  "النجف","كربلاء","بابل","الأنبار",
  "ديالى","ذي قار","السليمانية","صلاح الدين",
  "واسط","ميسان","المثنى","القادسية",
  "دهوك","كركوك"
];

function initProvinces(){
  const grid = document.getElementById('provinceGrid');
  grid.innerHTML = '';
  provinces.forEach(function(p){
    const div = document.createElement('div');
    div.className = 'province-chip';
    div.dataset.prov = p;
    div.innerHTML = '<span>' + p + '</span><span style="font-size:11px;background:rgba(0,0,0,0.35);padding:3px 7px;border-radius:20px" id="cnt-' + p + '">0</span>';
    div.onclick = function(){ toggleProv(p); };
    grid.appendChild(div);
  });
}

function toggleProv(p){
  if(selectedProvinces.has(p)) selectedProvinces.delete(p);
  else selectedProvinces.add(p);
  updateProvUI();
  if(allResults.length>0) filterAndRender();
}

function updateProvUI(){
  document.querySelectorAll('.province-chip').forEach(function(ch){
    ch.classList.toggle('active', selectedProvinces.has(ch.dataset.prov));
  });
  const txt = document.getElementById('selectedProvText');
  if(txt) txt.textContent = selectedProvinces.size===0 ? '' : 'المحدد: ' + Array.from(selectedProvinces).join('، ');
}

function selectAllProv(){
  provinces.forEach(function(p){ selectedProvinces.add(p); });
  updateProvUI();
  if(allResults.length>0) filterAndRender();
}

function clearProv(){
  selectedProvinces.clear();
  updateProvUI();
  if(allResults.length>0) filterAndRender();
}

function toggleProvince(){
  const c = document.getElementById('provinceContainer');
  const ch = document.getElementById('provChevron');
  c.classList.toggle('hidden');
  if(ch) ch.textContent = c.classList.contains('hidden') ? '▼' : '▲';
}

async function verifyCode(){
  const codeEl = document.getElementById('userCode');
  const userCode = codeEl.value.trim().toUpperCase();
  const errorEl = document.getElementById('error');
  if(!userCode){ showToast('ادخل الكود'); return; }
  const btn = codeEl.nextElementSibling;
  const orig = btn.innerHTML;
  btn.innerHTML = 'جاري التحقق...';
  btn.disabled = true;
  errorEl.innerText = '';
  try{
    if(!db) throw new Error('Firebase غير جاهز');
    const qs = await db.collection("codes").get();
    let ok = false;
    qs.forEach(function(doc){
      const data = doc.data();
      if(data.code === userCode && data.isActive) ok = true;
    });
    if(ok){
      showToast('✅ الكود صحيح!');
      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('searchApp').classList.remove('hidden');
      initProvinces();
    } else {
      errorEl.innerText = '❌ الكود غير صحيح أو معطل';
    }
  }catch(e){
    errorEl.innerText = 'خطأ: ' + e.message;
  }
  btn.innerHTML = orig;
  btn.disabled = false;
}

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');

if(dropZone){
  dropZone.addEventListener('dragover', function(e){
    e.preventDefault();
    dropZone.style.background = 'rgba(0,255,148,0.1)';
  });
  dropZone.addEventListener('dragleave', function(){
    dropZone.style.background = '';
  });
  dropZone.addEventListener('drop', function(e){
    e.preventDefault();
    dropZone.style.background = '';
    handleFiles(e.dataTransfer.files);
  });
}

if(fileInput){
  fileInput.addEventListener('change', function(e){
    handleFiles(e.target.files);
  });
}

function handleFiles(fl){
  files = Array.from(fl);
  renderFileList();
  if(files.length>0){
    document.getElementById('uploadSection').classList.add('hidden');
    document.getElementById('searchSection').classList.remove('hidden');
    document.getElementById('filesInfo').textContent = files.length + ' ملفات';
    resetSearch();
  }
}

function renderFileList(){
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  files.forEach(function(f,i){
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;margin-bottom:8px';
    div.innerHTML = '<span>📄 ' + f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)</span><span style="cursor:pointer" onclick="removeFile(' + i + ')">✕</span>';
    list.appendChild(div);
  });
}

function removeFile(i){
  files.splice(i,1);
  renderFileList();
  if(files.length===0) goBack();
}

function goBack(){
  files = [];
  if(fileInput) fileInput.value = '';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('searchSection').classList.add('hidden');
  document.getElementById('uploadSection').classList.remove('hidden');
  resetSearch();
}

function resetSearch(){
  allResults = [];
  provinceCounts = {};
  document.getElementById('results').innerHTML = '';
  document.getElementById('resultCount').textContent = '';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressContainer').style.display = 'none';
}

function startSearch(){
  query = document.getElementById('searchBox').value.trim();
  if(!query){ showToast('اكتب كلمة البحث'); return; }
  if(files.length===0){ showToast('اختار ملف'); return; }
  resetSearch();
  isSearching = true;
  shouldCancel = false;
  startTime = performance.now();
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('searchBtn').classList.add('hidden');
  document.getElementById('cancelBtn').classList.remove('hidden');
  processNextFile(0);
}

let currentFileIndex = 0;
let currentOffset = 0;
let currentRemainder = '';

function processNextFile(idx){
  if(shouldCancel){ endSearch(); return; }
  if(idx>=files.length){ endSearch(); return; }
  currentFileIndex = idx;
  currentOffset = 0;
  currentRemainder = '';
  processChunkFile(files[idx], function(){ processNextFile(idx+1); });
}

function processChunkFile(file, done){
  if(shouldCancel){ done(); return; }
  if(currentOffset>=file.size){
    if(currentRemainder) processText(currentRemainder, file.name);
    done();
    return;
  }
  const slice = file.slice(currentOffset, currentOffset+chunkSize);
  const reader = new FileReader();
  reader.onload = function(e){
    let text = currentRemainder + e.target.result;
    let lines = text.split("\n");
    currentRemainder = lines.pop();
    processText(lines.join("\n"), file.name);
    currentOffset += chunkSize;
    const totalProcessed = files.slice(0,currentFileIndex).reduce(function(s,f){return s+f.size;},0)+currentOffset;
    const totalSize = files.reduce(function(s,f){return s+f.size;},0);
    document.getElementById('progressBar').style.width = Math.floor((totalProcessed/totalSize)*100) + '%';
    setTimeout(function(){ processChunkFile(file,done); },0);
  };
  reader.readAsText(slice);
}

function processText(text,fileName){
  const lines = text.split("\n");
  lines.forEach(function(line){
    if(line.indexOf(query)===-1) return;
    const fields = line.split(',');
    const prov = fields[1] ? fields[1].trim() : 'غير معروف';
    if(selectedProvinces.size>0){
      let ok = false;
      selectedProvinces.forEach(function(sp){
        if(prov.indexOf(sp)!==-1) ok = true;
      });
      if(!ok) return;
    }
    provinceCounts[prov] = (provinceCounts[prov]||0)+1;
    allResults.push({fields:fields,fileName:fileName});
  });
  filterAndRender(true);
}

function filterAndRender(isLive){
  const container = document.getElementById('results');
  Object.keys(provinceCounts).forEach(function(p){
    const el = document.getElementById('cnt-' + p);
    if(el) el.textContent = provinceCounts[p];
  });
  let filtered = allResults;
  if(selectedProvinces.size>0){
    filtered = allResults.filter(function(r){
      const prov = r.fields[1] ? r.fields[1].trim() : '';
      for(let sp of selectedProvinces){
        if(prov.indexOf(sp)!==-1) return true;
      }
      return false;
    });
  }
  const toShow = filtered.slice(0, maxResults);
  container.innerHTML = '';
  toShow.forEach(function(item){
    const fields = item.fields;
    let rows = '';
    let copyText = '';
    function addRow(label,val){
      if(!val) return '';
      copyText += label + ': ' + val + '\n';
      return '<tr><th style="width:120px;color:#00ff94;padding:6px 0;text-align:right">' + label + ':</th><td style="padding:6px 0">' + val + '</td></tr>';
    }
    rows += addRow('الاسم', fields[0] ? fields[0].trim() : '');
    rows += addRow('المحافظه', fields[1] ? fields[1].trim() : '');
    rows += addRow('الرقم', fields[3] ? fields[3].trim() : '');
    if(!rows) return;
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;background:rgba(0,0,0,0.4);padding:4px 10px;border-radius:20px">' + item.fileName + '</span><span style="font-size:11px;background:rgba(227,6,19,0.2);padding:4px 10px;border-radius:20px">' + (fields[1] ? fields[1].trim() : '') + '</span></div><table style="width:100%">' + rows + '</table><button style="margin-top:10px;padding:8px 16px;background:#00ff94;border:none;border-radius:8px;color:#000;font-weight:800;cursor:pointer" data-copy="' + copyText.replace(/'/g,"&#39;") + '" onclick="copyFromData(this)">نسخ</button>';
    container.appendChild(div);
  });
  document.getElementById('resultCount').textContent = 'عدد النتائج: ' + filtered.length;
  if(!isLive && filtered.length===0 && !isSearching){
    container.innerHTML = "<div style='text-align:center;padding:30px;color:#ff6b6b'>لم يتم العثور على نتائج</div>";
  }
}

function endSearch(){
  isSearching = false;
  document.getElementById('progressContainer').style.display = 'none';
  document.getElementById('searchBtn').classList.remove('hidden');
  document.getElementById('cancelBtn').classList.add('hidden');
  document.getElementById('progressBar').style.width = '100%';
  filterAndRender();
}

function cancelSearch(){ shouldCancel = true; showToast('تم الغاء البحث'); }

function copyFromData(el){
  const txt = el.getAttribute('data-copy').replace(/&#39;/g,"'");
  navigator.clipboard.writeText(txt).then(function(){
    el.textContent = 'تم النسخ';
    setTimeout(function(){ el.textContent = 'نسخ'; },2000);
    showToast('تم النسخ');
  });
}

function logout(){
  document.getElementById('searchApp').classList.add('hidden');
  document.getElementById('loginContainer').classList.remove('hidden');
  goBack();
}

function showToast(msg){
  const t = document.getElementById('toast');
  const tt = document.getElementById('toastText');
  if(!t||!tt) return;
  tt.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },3000);
}

function toggleProvince(){
  const c = document.getElementById('provinceContainer');
  c.classList.toggle('hidden');
}
function selectAllProv(){
  provinces.forEach(function(p){ selectedProvinces.add(p); });
  updateProvUI();
  if(allResults.length>0) filterAndRender();
}
function clearProv(){
  selectedProvinces.clear();
  updateProvUI();
  if(allResults.length>0) filterAndRender();
}
function goBack(){
  files = [];
  if(fileInput) fileInput.value = '';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('searchSection').classList.add('hidden');
  document.getElementById('uploadSection').classList.remove('hidden');
  resetSearch();
}
</script>
